syntax = "proto3";

package com.pborsa.api.tradingengine.v1;

option java_multiple_files = true;
option java_package = "com.pborsa.api.tradingengine.v1";
option java_outer_classname = "TradingEngineProto";

import "google/protobuf/timestamp.proto";

service TradingEngineService {
  // Initial strategy execution with historical data streaming
  rpc ExecuteStrategy(stream StrategyExecutionChunk) returns (ExecutionAck);

  // Live bar updates (called periodically, e.g., every minute)
  rpc SendLiveBars(LiveBarUpdate) returns (LiveBarUpdateAck);

  // API calls this when order status changes
  rpc NotifyOrderStatusUpdate(OrderStatusUpdate) returns (OrderStatusUpdateAck);

  // API calls this when strategy status changes (e.g., strategy stopped)
  rpc NotifyStrategyStatusUpdate(StrategyStatusNotification) returns (StrategyStatusNotificationAck);

  // Execute a backtest against historical data
  rpc ExecuteBacktest(BacktestRequest) returns (BacktestResponse);
}

// Accepts trading/order requests (gRPC path into pBorsa API).
service TradingOrderService {
  rpc PlaceOrder(OrderRequest) returns (OrderResponse);
  // StreamOrderUpdates removed - using client-initiated calls via TradingEngineService.NotifyOrderStatusUpdate instead
}

message StrategyExecutionHeader {
  string execution_id = 1;
  int64 user_id = 2;
  int64 strategy_id = 3;
  string symbol = 4;
  string timeframe = 5;
  google.protobuf.Timestamp start = 6;
  google.protobuf.Timestamp end = 7;
  double budget = 8;                    // Strategy budget allocation
}

message Bar {
  google.protobuf.Timestamp timestamp = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 volume = 6;
  int64 trade_count = 7;
  double vwap = 8;
}

message BarBatch {
  repeated Bar bars = 1;
}

message StrategyExecutionChunk {
  oneof payload {
    StrategyExecutionHeader header = 1;
    BarBatch bar_batch = 2;
  }
}

message ExecutionAck {
  bool accepted = 1;
  string message = 2;
  string execution_id = 3;
}

// ===================== Live Bar Updates =====================

message SymbolBar {
  string symbol = 1;
  string timeframe = 2;
  Bar bar = 3;
}

message LiveBarUpdate {
  google.protobuf.Timestamp update_time = 1;
  repeated SymbolBar bars = 2;
  // Optional: which strategies are interested in these symbols
  repeated int64 strategy_ids = 3;
}

message LiveBarUpdateAck {
  bool received = 1;
  string message = 2;
  int32 bars_processed = 3;
}

// ===================== Orders =====================
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;
  STOP = 3;
  STOP_LIMIT = 4;
}

enum TimeInForce {
  TIF_UNSPECIFIED = 0;
  DAY = 1;
  GTC = 2;
  OPG = 3;
  CLS = 4;
  IOC = 5;
  FOK = 6;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ACCEPTED_BY_APP = 1;
  NEW = 2;
  PARTIALLY_FILLED = 3;
  FILLED = 4;
  DONE_FOR_DAY = 5;
  CANCELLED = 6;
  EXPIRED = 7;
  REPLACED = 8;
  PENDING_CANCEL = 9;
  PENDING_REPLACE = 10;
  REJECTED = 11;
  PENDING_NEW = 12;
  ACCEPTED = 13;
  ACCEPTED_FOR_BIDDING = 14;
  STOPPED = 15;
  SUSPENDED = 16;
  CALCULATED = 17;
  HELD = 18;
  CANCEL_REQUESTED = 19;
}

enum OrderStatusReason {
  ORDER_STATUS_REASON_UNSPECIFIED = 0;
  INSUFFICIENT_FUNDS = 1;
  RATE_LIMIT = 2;
  INVALID_ORDER = 3;
  MARKET_CLOSED = 4;
  AUTH_ERROR = 5;
  UNKNOWN = 6;
}
//TODO:
message OrderRequest {
  int64 user_id = 1;
  string symbol = 2;
  double quantity = 3;
  OrderSide side = 4;
  OrderType type = 5;
  TimeInForce time_in_force = 6;
  double limit_price = 7;
  double stop_price = 8;
  bool extended_hours = 9;
  string client_order_id = 10;
  int64 strategy_id = 11;
}

message OrderResponse {
  string workflow_id = 1;
  OrderStatus status = 2;
}

message OrderStatusUpdate {
  // Order identifiers
  string order_id = 1;              // UUID as string
  string workflow_id = 2;           // Optional
  string client_order_id = 3;       // Required - used to route to correct trading engine
  string alpaca_order_id = 4;       // Optional

  // Status information
  OrderStatus status = 5;
  OrderStatusReason reason = 6;     // Optional
  string message = 7;               // Optional

  // Timestamps
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp created_at = 9;  // Order creation time

  // Resume token for reconnection (UUID string of order_history.id)
  string resume_token = 10;

  // Fill information (available when status is FILLED or PARTIALLY_FILLED)
  string symbol = 11;               // Trading symbol
  OrderSide side = 12;              // BUY or SELL
  double filled_quantity = 13;      // Actual filled quantity
  double filled_avg_price = 14;     // Average fill price
}

message OrderStatusUpdateAck {
  bool received = 1;
  string message = 2;
}

// ===================== Strategy Status Notifications =====================

enum StrategyStatus {
  STRATEGY_STATUS_UNSPECIFIED = 0;
  STRATEGY_CREATED = 1;
  STRATEGY_PREPARING = 2;
  STRATEGY_ACTIVE = 3;
  STRATEGY_PAUSED = 4;
  STRATEGY_STOPPED = 5;
  STRATEGY_START_FAILED = 6;
}

message StrategyStatusNotification {
  int64 strategy_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  StrategyStatus old_status = 4;
  StrategyStatus new_status = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message StrategyStatusNotificationAck {
  bool received = 1;
  string message = 2;
}

// ===================== Backtesting =====================

message BacktestRequest {
  string backtest_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  string base_strategy_code = 4;
  google.protobuf.Timestamp testing_start = 5;
  google.protobuf.Timestamp testing_end = 6;
  double budget = 7;
  repeated Bar history_before_start = 8;  // Historical context before testing period
  repeated Bar history_testing_range = 9; // Data for actual testing
}

message BacktestOrder {
  string symbol = 1;
  double quantity = 2;
  OrderSide side = 3;
  double price = 4;
  google.protobuf.Timestamp executed_at = 5;
}

message BacktestResponse {
  string backtest_id = 1;
  bool success = 2;
  string message = 3;
  repeated BacktestOrder orders = 4;
  double pnl = 5;
  double max_drawdown = 6;
  int32 total_trades = 7;
  int32 winning_trades = 8;
}
