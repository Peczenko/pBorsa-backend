spring.application.name=pborsa-trading-worker
spring.datasource.url=jdbc:postgresql://localhost:5432/pborsa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

temporal.enabled=true
spring.temporal.connection.target=localhost:7233
spring.temporal.namespace=default

# Same activity/workflow/worker configs as before
temporal.activities.trading.start-to-close-timeout=10m
temporal.activities.trading.max-attempts=5
temporal.activities.trading.initial-retry-interval=5s
temporal.activities.trading.backoff-coefficient=2.0

temporal.activities.market-data.start-to-close-timeout=2m
temporal.activities.market-data.max-attempts=2
temporal.activities.market-data.initial-retry-interval=1s
temporal.activities.market-data.backoff-coefficient=1.5

temporal.workflows.execution-timeout=1h
temporal.workflows.run-timeout=30m
temporal.workflows.task-timeout=10m

temporal.workers.trading.max-concurrent-activities=50
temporal.workers.trading.max-concurrent-workflows=25
temporal.workers.trading.max-concurrent-activity-task-pollers=2
temporal.workers.trading.max-concurrent-workflow-task-pollers=2
temporal.workers.market-data.max-concurrent-activities=100
temporal.workers.market-data.max-concurrent-workflows=50
temporal.workers.market-data.max-concurrent-activity-task-pollers=2
temporal.workers.market-data.max-concurrent-workflow-task-pollers=2

# Caching
spring.cache.type=caffeine
cache.api-credentials.maximum-size=1000
cache.api-credentials.expire-after-write=1h
cache.alpaca-clients.maximum-size=1000
cache.alpaca-clients.expire-after-write=1h

# Encryption
encryption.secret-key=${ENCRYPTION_SECRET_KEY:pBorsaSecretKey32CharactersLong!}

# Alpaca
alpaca.default.endpoint-type=PAPER
alpaca.default.data-source=IEX
alpaca.market-data.websocket-source=IEX

# Trading engine
trading.engine.grpc.enabled=true
trading.engine.grpc.address=localhost:9090
trading.engine.grpc.batch-size=1000
trading.engine.grpc.page-limit=10000

logging.level.root=INFO
logging.level.com.pborsa=DEBUG
logging.level.io.temporal=INFO

