<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    const userId = "1";

    const socket = new SockJS("http://localhost:8080/ws/market-data");
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, () => {
        // 1) subscribe to receive trades
        stompClient.subscribe(`/topic/trades/${userId}`, (msg) => {
            console.log("TRADE:", JSON.parse(msg.body));
        });

        // 2) ask server to start streaming for these symbols
        stompClient.send(
            `/app/subscribe/trades/${userId}`,
            {},
            JSON.stringify(["AAPL", "TSLA"])
        );
    });
</script>
