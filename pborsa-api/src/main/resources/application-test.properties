# Test Profile Configuration
spring.application.name=pBorsa-backend-test

# =====================================
# DISABLE FIREBASE AUTH FOR TESTING
# =====================================
firebase.enabled=false

# =====================================
# DISABLE EXTERNAL SERVICES
# =====================================
temporal.enabled=false
trading.engine.grpc.enabled=false
credentials.notify.enabled=false

# =====================================
# DATABASE (Testcontainers)
# =====================================
# Using @ServiceConnection, these will be overridden by Testcontainers
spring.datasource.url=jdbc:tc:postgresql:16:///pborsa_test
spring.datasource.username=test
spring.datasource.password=test

# =====================================
# FLYWAY MIGRATIONS
# =====================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =====================================
# JPA SETTINGS
# =====================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# DISABLE CACHING
# =====================================
spring.cache.type=none

# =====================================
# ENCRYPTION (Test key)
# =====================================
encryption.secret-key=TestSecretKeyFor32CharactersLong!

# =====================================
# LOGGING
# =====================================
logging.level.root=INFO
logging.level.com.pborsa=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.testcontainers=INFO
