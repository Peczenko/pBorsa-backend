# Application
spring.application.name=pBorsa-backend
server.port=8080

# =====================================
# DATABASE CONFIGURATION
# =====================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pborsa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================
# ALPACA API CONFIGURATION
# =====================================
# Default Alpaca configuration (can be overridden per user)
alpaca.default.endpoint-type=PAPER
alpaca.default.data-source=IEX
# Market data websocket source: IEX (free) or SIP (paid)
alpaca.market-data.websocket-source=IEX
# Polling interval for market data in milliseconds
alpaca.market-data.polling-interval=1000

# =====================================
# CACHING CONFIGURATION (Caffeine)
# =====================================
spring.cache.type=caffeine
# Cache specifications: name=maximumSize,expireAfterWrite
cache.api-credentials.maximum-size=1000
cache.api-credentials.expire-after-write=1h
cache.market-data.maximum-size=10000
cache.market-data.expire-after-write=5s
cache.positions.maximum-size=5000
cache.positions.expire-after-write=30s
cache.account-info.maximum-size=1000
cache.account-info.expire-after-write=1m

# =====================================
# TEMPORAL WORKFLOW ENGINE
# =====================================
temporal.enabled=true
spring.temporal.connection.target=localhost:7233
spring.temporal.namespace=default

# Temporal Activity Configuration
temporal.activities.trading.start-to-close-timeout=10m
temporal.activities.trading.max-attempts=5
temporal.activities.trading.initial-retry-interval=5s
temporal.activities.trading.backoff-coefficient=2.0

temporal.activities.market-data.start-to-close-timeout=2m
temporal.activities.market-data.max-attempts=2
temporal.activities.market-data.initial-retry-interval=1s
temporal.activities.market-data.backoff-coefficient=1.5

# Temporal Workflow Configuration
temporal.workflows.execution-timeout=1h
temporal.workflows.run-timeout=30m
temporal.workflows.task-timeout=10m

# Temporal Worker Configuration (removed - workers run in separate pborsa-trading-worker module)

# =====================================
# ASYNC CONFIGURATION
# =====================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=async-exec-

# =====================================
# WEBSOCKET CONFIGURATION
# =====================================
websocket.allowed-origins=*
websocket.endpoint=/ws/market-data

# =====================================
# ENCRYPTION (Change in production!)
# =====================================
encryption.secret-key=${ENCRYPTION_SECRET_KEY:pBorsaSecretKey32CharactersLong!}

# =====================================
# LOGGING
# =====================================
logging.level.root=INFO
logging.level.com.pborsa=DEBUG
logging.level.net.jacobpeterson.alpaca=INFO
logging.level.io.temporal=INFO
