plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':pborsa-domain')
    implementation project(':pborsa-temporal-api')
    implementation project(':pborsa-trading')
    
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    
    // Temporal (client only, no workers)
    implementation 'io.temporal:temporal-sdk:1.25.2'
    
    // Database (for credentials lookup if needed, but workers handle activities)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

springBoot {
    mainClass = 'com.pborsa.api.PBorsaBackendApplication'
}

